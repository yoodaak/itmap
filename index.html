<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Ccircle cx='6' cy='7' r='3.2' fill='%234F46E5'/%3E%3Ccircle cx='20' cy='6' r='2.6' fill='%238B5CF6'/%3E%3Ccircle cx='13' cy='19' r='3.6' fill='%234F46E5'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script>
/* IT MAP standalone runtime: provides window.claude.use('sample') backed by /api/ai (Gemini). */
(function(){
  var PW_KEY='itmap.sitePassword', TR='\u0000[[TRUNCATED]]';
  function err(code,message,text){return {code:code,message:message||code,text:text}}
  async function call(messages,opts,json,retried){
    var pw=''; try{pw=localStorage.getItem(PW_KEY)||''}catch(e){}
    var res;
    try{
      res=await fetch('/api/ai',{method:'POST',headers:{'content-type':'application/json','x-site-password':pw},body:JSON.stringify({messages:messages,json:!!json}),signal:opts.signal});
    }catch(e){ throw err(e&&e.name==='AbortError'?'cancelled':'upstream_error',String(e)) }
    if(res.status===401){
      try{localStorage.removeItem(PW_KEY)}catch(e){}
      var p=window.prompt(retried?'비밀번호가 맞지 않아요. 다시 입력하세요.':'AI 기능을 쓰려면 IT MAP 비밀번호를 입력하세요.');
      if(p){ try{localStorage.setItem(PW_KEY,p)}catch(e){} return call(messages,opts,json,true) }
      throw err('not_granted','password required');
    }
    if(res.status===429){ var m=''; try{m=(await res.json()).error}catch(e){} window.ITMAP_LAST_ERR=m||''; throw err('rate_limited',m) }
    if(!res.ok){ var d=''; try{d=(await res.json()).error}catch(e){ d='서버 응답 '+res.status+(res.status===504?' (시간 초과)':'') } console.warn('[IT MAP] /api/ai',res.status,d); window.ITMAP_LAST_ERR=d||('서버 응답 '+res.status); throw err('upstream_error',d) }
    var reader=res.body.getReader(), dec=new TextDecoder(), text='', truncated=false;
    try{
      for(;;){
        var r=await reader.read(); if(r.done) break;
        var chunk=dec.decode(r.value,{stream:true}); text+=chunk;
        if(text.indexOf(TR)>=0){ truncated=true; text=text.split(TR).join(''); chunk=chunk.split(TR).join('') }
        if(opts.onText&&text) try{opts.onText({text:text,delta:chunk})}catch(e){}
      }
    }catch(e){ if(!(e&&e.name==='AbortError')) window.ITMAP_LAST_ERR='응답이 중간에 끊겼어요 (시간 초과일 수 있어요)'; throw err(e&&e.name==='AbortError'?'cancelled':'upstream_error',String(e),text) }
    if(!text.trim()){ window.ITMAP_LAST_ERR='AI 응답이 비어 있어요. 잠시 후 다시 시도해 주세요.'; throw err('empty_completion') }
    window.ITMAP_LAST_ERR='';
    return {text:text,truncated:truncated};
  }
  function parseJSON(text){
    try{return JSON.parse(text)}catch(e){}
    var f=text.match(/```(?:json)?\s*([\s\S]*?)```/); if(f){try{return JSON.parse(f[1])}catch(e){}}
    var a=text.search(/[\[{]/), b=Math.max(text.lastIndexOf('}'),text.lastIndexOf(']'));
    if(a>=0&&b>a){try{return JSON.parse(text.slice(a,b+1))}catch(e){}}
    throw err('invalid_json','could not parse JSON',text);
  }
  function toMsgs(input){return typeof input==='string'?[{role:'user',content:input}]:input}
  function sample(input,opts){return call(toMsgs(input),opts||{},false)}
  sample.json=async function(input,opts){var r=await call(toMsgs(input),opts||{},true);return parseJSON(r.text)};
  window.ITMAP_STANDALONE=true;
  window.claude={use:async function(name){return name==='sample'?sample:null}};
})();

</script>
</head>
<body>
<title>IT MAP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: left sidebar app shell (bottom nav on phones); content column max 1100px; map view fills the column. */
:root{
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F5F9; --line:#E2E8F0; --line-2:#CBD5E1;
  --text:#111827; --muted:#64748B; --faint:#94A3B8;
  --primary:#4F46E5; --primary-soft:#EEF2FF; --primary-line:#C7D2FE; --on-primary:#FFFFFF;
  --accent:#8B5CF6; --accent-soft:#F5F3FF;
  --ok:#10B981; --ok-soft:#ECFDF5; --ok-text:#047857;
  --warn:#F59E0B; --warn-soft:#FFFBEB; --warn-text:#B45309;
  --err:#EF4444; --err-soft:#FEF2F2; --err-text:#B91C1C;
  --edge:#CBD5E1; --edge-hot:#4F46E5;
  --c-network:#4F46E5; --c-os:#0F766E; --c-web:#8B5CF6; --c-db:#D97706; --c-infra:#0284C7; --c-security:#E11D48;
  --term-bg:#0F172A; --term-fg:#E2E8F0;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.06);
  --f-body:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0F19; --surface:#111827; --surface-2:#182033; --line:#243045; --line-2:#334155;
  --text:#E5E7EB; --muted:#94A3B8; --faint:#64748B;
  --primary:#818CF8; --primary-soft:#1E1B4B; --primary-line:#3730A3; --on-primary:#0B0F19;
  --accent:#A78BFA; --accent-soft:#2A1856;
  --ok:#34D399; --ok-soft:#06281D; --ok-text:#6EE7B7;
  --warn:#FBBF24; --warn-soft:#2A1E05; --warn-text:#FCD34D;
  --err:#F87171; --err-soft:#2C1012; --err-text:#FCA5A5;
  --edge:#334155; --edge-hot:#818CF8;
  --c-network:#818CF8; --c-os:#2DD4BF; --c-web:#C4B5FD; --c-db:#FBBF24; --c-infra:#38BDF8; --c-security:#FB7185;
  --term-bg:#020617; --term-fg:#E2E8F0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F19; --surface:#111827; --surface-2:#182033; --line:#243045; --line-2:#334155;
  --text:#E5E7EB; --muted:#94A3B8; --faint:#64748B;
  --primary:#818CF8; --primary-soft:#1E1B4B; --primary-line:#3730A3; --on-primary:#0B0F19;
  --accent:#A78BFA; --accent-soft:#2A1856;
  --ok:#34D399; --ok-soft:#06281D; --ok-text:#6EE7B7;
  --warn:#FBBF24; --warn-soft:#2A1E05; --warn-text:#FCD34D;
  --err:#F87171; --err-soft:#2C1012; --err-text:#FCA5A5;
  --edge:#334155; --edge-hot:#818CF8;
  --c-network:#818CF8; --c-os:#2DD4BF; --c-web:#C4B5FD; --c-db:#FBBF24; --c-infra:#38BDF8; --c-security:#FB7185;
  --term-bg:#020617; --term-fg:#E2E8F0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.02em}
p{margin:0}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);padding:20px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:700;letter-spacing:-.01em;font-size:16px;background:none;border:0;text-align:left}
.brand-mark{width:26px;height:26px;flex:none}
.navitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:none;color:var(--muted);font-size:14px;font-weight:500;text-align:left;width:100%}
.navitem svg{width:18px;height:18px;flex:none}
.navitem:hover{background:var(--surface-2);color:var(--text)}
.navitem.on{background:var(--primary-soft);color:var(--primary)}
.navsep{height:1px;background:var(--line);margin:14px 6px}
.navlabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0 10px 6px;font-weight:600}
.trail-side{display:flex;flex-direction:column;gap:2px}
.trail-side button{border:0;background:none;text-align:left;padding:5px 10px;border-radius:6px;color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center}
.trail-side button:hover{background:var(--surface-2);color:var(--text)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--faint)}
main{min-width:0;padding:32px 40px 72px}
.wrap{max-width:1100px;margin:0 auto}
.bottomnav{display:none}
.topbar{display:none}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{display:none}
  main{padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottomnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0}
  .bottomnav button svg{width:20px;height:20px}
  .bottomnav button.on{color:var(--primary)}
}

/* ---------- common ---------- */
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--primary);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:9px;padding:9px 16px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--text);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--line-2);background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--surface-2)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:14px;font-weight:500;color:var(--text);transition:border-color .15s,background .15s,transform .15s}
button.chip:hover{border-color:var(--primary-line);background:var(--primary-soft);color:var(--primary)}
.chip .dot{width:8px;height:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.reltype{font-family:var(--f-mono);font-size:11.5px;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:5px;white-space:nowrap}
.diff{display:inline-flex;gap:3px;align-items:center}
.diff i{width:6px;height:6px;border-radius:2px;background:var(--line-2)}
.diff i.on{background:var(--primary)}
.cat-network{--cat:var(--c-network)}.cat-os{--cat:var(--c-os)}.cat-web{--cat:var(--c-web)}.cat-db{--cat:var(--c-db)}.cat-infra,.cat-cloud,.cat-devops{--cat:var(--c-infra)}.cat-security{--cat:var(--c-security)}.cat-cs{--cat:var(--c-os)}
.catdot{background:var(--cat,var(--faint))}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.section-title h2{font-size:20px}
.term{background:var(--term-bg);color:var(--term-fg);font-family:var(--f-mono);font-size:13px;line-height:1.6;border-radius:10px;padding:14px 16px;white-space:pre-wrap;overflow-x:auto}

/* search */
.searchbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:6px 6px 6px 16px;box-shadow:var(--shadow);transition:border-color .15s}
.searchbar:focus-within{border-color:var(--primary)}
.searchbar svg{width:20px;height:20px;color:var(--muted);flex:none}
.searchbar input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;padding:10px 0}
.searchbar.big input{font-size:18px;padding:13px 0}

/* home */
.hero{padding:40px 0 32px;display:flex;flex-direction:column;align-items:flex-start;gap:20px;max-width:760px}
.hero h1{font-size:clamp(30px,5vw,46px);line-height:1.2;font-weight:700}
.hero h1 em{font-style:normal;color:var(--primary)}
.hero .searchbar{width:100%}
.suggest{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.home-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;margin-top:12px}
.thinkcard{background:linear-gradient(160deg,var(--primary-soft),var(--surface) 70%);border-color:var(--primary-line);display:flex;flex-direction:column;gap:14px}
.thinkcard blockquote{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.journey{display:flex;flex-direction:column;gap:0}
.jstep{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;border:0;background:none;text-align:left;padding:0}
.jstep .rail{display:flex;flex-direction:column;align-items:center;height:100%}
.jstep .rail b{width:12px;height:12px;border-radius:50%;border:2px solid var(--primary);background:var(--surface);margin-top:6px}
.jstep .rail span{flex:1;width:2px;background:var(--primary-line);min-height:22px}
.jstep:last-child .rail span{display:none}
.jstep .jbody{padding-bottom:12px}
.jstep .jbody strong{font-size:15px}
.jstep .jbody p{font-size:13.5px;color:var(--muted)}
.jstep:hover strong{color:var(--primary)}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:28px;color:var(--muted);font-size:14px}
.stats b{display:block;font-size:24px;color:var(--text);font-variant-numeric:tabular-nums}
@media (max-width:860px){.home-grid{grid-template-columns:1fr}.hero{padding:16px 0 28px}}

/* explore */
.ex-head{display:flex;flex-direction:column;gap:16px;margin-bottom:24px}
.ex-main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.flow{display:flex;flex-direction:column;gap:14px}
.flow .arrow{color:var(--faint);font-size:13px;display:flex;align-items:center;gap:8px}
.flow .arrow::before{content:"";width:1.5px;height:18px;background:var(--line-2);margin-left:8px}
.result-top h2{font-size:30px}
.result-top .sub{color:var(--muted);font-size:14px}
.result-list{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.ritem{display:flex;align-items:center;gap:14px;border:0;background:none;padding:10px 12px;border-radius:10px;text-align:left;width:100%}
.ritem:hover{background:var(--surface-2)}
.ritem .rname{font-weight:600;min-width:110px}
.ritem .rsum{color:var(--muted);font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scen-suggest{display:flex;gap:14px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid var(--line);border-radius:12px;padding:14px 16px;flex-wrap:wrap}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.catbox h3{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.catbox h3 .dot{width:10px;height:10px}
.catbox .chips{gap:6px}
.catbox .chip{font-size:13px;padding:3px 11px}
@media (max-width:980px){.ex-main{grid-template-columns:minmax(0,1fr)}}

/* ego mini map */
.ego{width:100%;height:auto;display:block}
.ego .e{stroke:var(--line-2);stroke-width:1.4;fill:none}
.ego .e.pre{stroke:var(--primary-line)}
.ego g.n{cursor:pointer}
.ego g.n rect{fill:var(--surface);stroke:var(--line-2);stroke-width:1.2}
.ego g.n text{fill:var(--text);font-size:12px;font-weight:500;font-family:var(--f-body)}
.ego g.n:hover rect{stroke:var(--primary);fill:var(--primary-soft)}
.ego g.n.center rect{fill:var(--primary);stroke:var(--primary)}
.ego g.n.center text{fill:var(--on-primary);font-weight:700}
.ego .cap{fill:var(--faint);font-size:10px;font-family:var(--f-mono);letter-spacing:.05em}
.minimap-card{padding:16px}
.minimap-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}

/* detail */
.trail{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:18px}
.trail button{border:0;background:none;color:var(--muted);padding:2px 4px;border-radius:5px}
.trail button:hover{color:var(--primary)}
.trail .cur{color:var(--text);font-weight:600}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
.dhead{display:flex;flex-direction:column;gap:10px;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:22px}
.dhead h1{font-size:40px;line-height:1.1}
.dhead .full{color:var(--muted);font-size:15px}
.dhead .summary{font-size:17px;max-width:62ch}
.dhead .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.steps-nav{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.steps-nav button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px 5px 6px;font-size:13px;font-weight:600;color:var(--muted)}
.steps-nav button b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:11px;font-family:var(--f-mono)}
.steps-nav button.done{color:var(--text)}
.steps-nav button.done b{background:var(--primary-soft);color:var(--primary)}
.steps-nav button.cur{border-color:var(--primary);color:var(--primary)}
.steps-nav button.cur b{background:var(--primary);color:var(--on-primary)}
.steps-nav button.locked{opacity:.55;cursor:default}
.stepblock{border-left:2px solid var(--line);padding:2px 0 26px 22px;position:relative;animation:rise .35s ease both}
.stepblock::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--primary)}
.stepblock:last-child{border-left-color:transparent}
.stepblock .q{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--primary);font-weight:500}
.stepblock h3{font-size:20px;margin:2px 0 10px}
.stepblock .body{max-width:65ch;display:flex;flex-direction:column;gap:14px}
.concepts{display:flex;flex-wrap:wrap;gap:6px}
.concepts span{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 9px}
.tree{display:flex;flex-direction:column;font-size:14.5px}
.tree .root{font-weight:700;font-family:var(--f-mono);font-size:14px}
.tree .branch{display:flex;align-items:center;gap:10px;padding:4px 0 4px 18px;position:relative;flex-wrap:wrap}
.tree .branch::before{content:"";position:absolute;left:5px;top:0;bottom:0;border-left:1.5px solid var(--line-2)}
.tree .branch:last-child::before{bottom:50%}
.tree .branch::after{content:"";position:absolute;left:5px;top:50%;width:10px;border-top:1.5px solid var(--line-2)}
.tree .branch .nlink{border:0;background:none;padding:0;font-weight:600;color:var(--text)}
.tree .branch .nlink:hover{color:var(--primary);text-decoration:underline}
.why-btn{border:1px dashed var(--line-2);background:none;border-radius:6px;font-size:12px;padding:1px 8px;color:var(--muted)}
.why-btn:hover{border-color:var(--accent);color:var(--accent)}

function loadCustom(docs){
  const added=[];

  Object.entries(docs).forEach(([k,d])=>{ if(d&&d.kind==='scenario'&&d.scenario&&!SCN[d.scenario.id]){const s={...d.scenario,ai:true,docId:k};SCENARIOS.push(s);SCN[s.id]=s} });
  Object.entries(docs).forEach(([k,d])=>{
    if(d&&d.kind==='edge'&&d.edge&&has(d.edge.s)&&has(d.edge.t)&&!EDGES.some(x=>x.docId===k)) EDGES.push({...d.edge,i:EDGES.length,user:true,docId:k});
    if(d&&d.kind==='insight'&&d.insight&&!INSIGHTS.some(x=>x.docId===k)) INSIGHTS.push({...d.insight,docId:k});

    if(d&&d.kind==='qa'&&d.qa&&!QAS.some(x=>x.docId===k)) QAS.push({...d.qa,docId:k});

}

}

const GEN_TYPES=['depends_on','built_on','part_of','used_with','related_to','alternative_to','affected_by','causes'];

let GEN=null; // {kind,q,busy,ctl,start} | {kind,q,error}

}
async function genConcept(q,signal,parent){
  const P=parent&&byId[parent];
  const prompt=`당신은 개인 IT 학습 지도 "IT MAP"의 편집자입니다. 학습자가 "${q}"를 검색했습니다.
${P?`이 개념은 "${P.name}"(id: ${P.id})의 구성 요소 또는 하위 주제입니다. edges에 반드시 {"target":"${P.id}","from":"new","type":"part_of"}를 포함하세요. 같은 이름의 다른 기술과 헷갈리지 않게 ${P.name} 맥락에서 설명하세요.\n`:''}목표는 암기가 아니라 '다른 개념과의 관계'로 이해시키는 것입니다.

지금 지도에 있는 개념 (id: 이름 — 요약):
${nodeListText()}

해야 할 일:
- 검색어가 위 목록에 이미 있는 개념과 같은 것(표기만 다름)이면 {"existing":"그 id"} 만 출력.
- 검색어가 IT와 무관하면 {"notIT":true} 만 출력.
- 검색어가 상황/문장이면(예: "서버가 느려요") 그 상황을 이해하는 데 가장 핵심인, 지도에 없는 개념 하나를 고르세요.
- 그 외에는 검색어에 해당하는 개념·기술·솔루션 노드 하나를 만드세요.

작성 규칙:
- 모든 문장은 한국어. 초보자도 이해할 수 있게, 전문 용어는 처음 나올 때 풀어서.
- id: 영문 소문자 kebab-case, 위 목록의 id와 겹치지 않게.
- cats: network, os, web, db, infra, cloud, devops, security, cs 중 1~3개.
- diff: 난이도 1~5 정수.
- what: 이게 무엇인지 2~3문장. why: 왜 필요한지(이게 없으면 어떤 문제가 생기는지) 2~3문장.
- concepts: 핵심 하위 개념 4~6개 (영문 용어 위주, 짧게).
- one: 한 줄 요약 (비유 가능).
- think: 이 개념에 문제가 생기는 상황을 묻는 질문 q, 생각의 방향을 주는 hint, 해설 a.
- kw: 검색에 쓰일 한국어/영어 키워드 4~8개(소문자).
- edges: 위 목록의 기존 개념과의 관계 3~6개. 각 항목:
  {"target":"기존 id","from":"new" 또는 "existing","type":"...","why":"1~2문장","sr":"출발 쪽 역할(12자 이내)","tr":"도착 쪽 역할(12자 이내)"}
  from이 "new"면 새 개념 → target 방향, "existing"이면 target → 새 개념 방향.
  type: depends_on(출발이 도착에 의존/도착을 알아야 이해됨), built_on(도착 위에 만들어짐), part_of(도착의 일부), used_with, related_to, alternative_to, affected_by, causes.
  why는 두 개념이 '각각 무슨 역할을 해서' 연결되는지 설명.
- suggest: 지도에 아직 없지만 이어서 배우면 좋은 개념 이름 3~5개.

JSON 하나만 출력:
{"id":"","name":"","full":"","cats":[],"diff":2,"summary":"","what":"","why":"","concepts":[],"one":"","think":{"q":"","hint":"","a":""},"kw":[],"edges":[],"suggest":[]}`;
  const r=await CLOUD.sample.json(prompt,{signal,modelTier:'default'});
  if(r&&r.existing&&has(r.existing)) return {existing:r.existing};
  if(!r||r.notIT) return {notIT:true};
  let id=slug(r.id)||slug(r.name)||('c-'+Date.now().toString(36));
  if(byId[id]){ if(byId[id].name.toLowerCase()===str(r.name).toLowerCase()) return {existing:id}; id=id+'-'+Date.now().toString(36).slice(-3); }
  const cats=(Array.isArray(r.cats)?r.cats:[]).filter(c=>CATS[c]).slice(0,3); if(!cats.length) cats.push('cs');
  const arr=v=>Array.isArray(v)?v:[];
  const node={id,name:str(r.name,60)||q,full:str(r.full,90),cats,diff:Math.min(5,Math.max(1,Math.round(+r.diff||2))),
    summary:str(r.summary,220),what:str(r.what),why:str(r.why),concepts:arr(r.concepts).map(c=>str(c,40)).filter(Boolean).slice(0,8),
    one:str(r.one,220),think:{q:str(r.think&&r.think.q,300),hint:str(r.think&&r.think.hint,300),a:str(r.think&&r.think.a)},
    kw:[...new Set([q.toLowerCase().trim(),...arr(r.kw).map(k=>str(k,30).toLowerCase())])].filter(Boolean).slice(0,12),
    suggest:arr(r.suggest).map(s=>str(s,40)).filter(Boolean).slice(0,6),created:new Date().toISOString(),query:q};
  if(!node.summary||!node.what) throw {code:'bad_shape'};
  if(P) node.parent=P.id;
  const edges=[];
  arr(r.edges).forEach(e=>{const tg=String(e&&e.target||'');if(!has(tg)||!GEN_TYPES.includes(e.type))return;const out=e.from!=='existing';const s=out?id:tg,t=out?tg:id;if(edges.some(x=>x.s===s&&x.t===t))return;edges.push({s,t,type:e.type,why:str(e.why,400),sr:str(e.sr,40),tr:str(e.tr,40)})});
  if(P&&!edges.some(e=>e.s===id&&e.t===P.id)) edges.push({s:id,t:P.id,type:'part_of',why:`${node.name}은(는) ${P.name}을(를) 이루는 구성 요소입니다.`,sr:'구성 요소',tr:'전체 시스템'});
  const docId='n-'+id, doc={kind:'node',node,edges};
  loadCustom({[docId]:doc}); await persist(docId,doc);
  return {id};
}
async function genScenario(q,signal){
  const prompt=`당신은 개인 IT 학습 사이트 "IT MAP"의 사고 훈련 문제 출제자입니다. 학습자가 이런 상황을 입력했습니다: "${q}"
정답 암기가 아니라 '어디부터 의심하고, 단서로 범위를 좁히는' 사고 과정을 훈련하는 단계형 문제를 만드세요.

지도에 있는 개념 (id: 이름):
${NODES.map(n=>n.id+': '+n.name).join('\n')}

규칙:
- 모든 문장은 한국어. 실제 현장처럼 구체적으로(도메인, 명령어 출력, 수치).
- status: 처음에 알려진 정보 4~6개. s는 "ok"(정상 확인됨) 또는 "unk"(아직 모름). v는 짧은 값.
- steps: 3단계. 각 단계는 q(질문), 선택적 clue(추가 단서), options 4개.
  - option: label(짧게), sub(부연 8자 내외), ok(true/false), coach(왜 맞는지/왜 그 방향이 아닌지 1~2문장).
  - 정답 option에는 headline(확인 결과 한 줄)과 result(터미널 명령과 출력, 2~4줄)를 넣고, reveal로 status를 갱신: [{"k":"status의 k와 정확히 같은 문자열","s":"ok"|"bad","v":"짧은 값"}].
  - 각 단계에 ok:true는 1개(최대 2개). 오답 option에도 가능하면 result를 넣어 '확인해 보니 정상'임을 보여주세요.
- conclusion: 최종 원인과 조치 2문장. lesson: 이 문제로 배우는 사고방식 1~2문장.
- path: 요청/데이터가 흐르는 경로를 위 목록의 id로 4~7개 순서대로.
- related: 관련 개념 id 3~6개 (위 목록에서만). review: 복습할 핵심 개념 id 1개.
- 상황이 IT와 무관하면 {"notIT":true} 만 출력.

JSON 하나만 출력:
{"title":"","scenario":"","teaser":"","status":[{"k":"","s":"ok","v":""}],"steps":[{"q":"","clue":"","options":[{"label":"","sub":"","ok":false,"coach":"","result":"","headline":"","reveal":[]}]}],"conclusion":"","lesson":"","path":[],"related":[],"review":""}`;
  const r=await CLOUD.sample.json(prompt,{signal,modelTier:'default'});
  if(!r||r.notIT) return {notIT:true};
  const arr=v=>Array.isArray(v)?v:[];
  const status=arr(r.status).map(x=>({k:str(x&&x.k,40),s:x&&x.s==='ok'?'ok':'unk',v:str(x&&x.v,40)})).filter(x=>x.k).slice(0,7);
  const keys=new Set(status.map(x=>x.k));
  const steps=arr(r.steps).map(st=>({q:str(st&&st.q,300),clue:str(st&&st.clue,300),options:arr(st&&st.options).slice(0,4).map(o=>({label:str(o&&o.label,40),sub:str(o&&o.sub,30),ok:!!(o&&o.ok),coach:str(o&&o.coach,500),result:str(o&&o.result,600),headline:str(o&&o.headline,120),reveal:arr(o&&o.reveal).filter(v=>v&&keys.has(v.k)).map(v=>({k:v.k,s:v.s==='bad'?'bad':'ok',v:str(v.v,60)}))})).filter(o=>o.label)})).filter(st=>st.q&&st.options.length>=2&&st.options.some(o=>o.ok));
  if(!steps.length||!str(r.title)) throw {code:'bad_shape'};
  const ids=v=>arr(v).filter(x=>has(x));
  const sid='ai-'+Date.now().toString(36);
  const sc={id:sid,kind:'troubleshoot',kindLabel:'원인 추적',title:str(r.title,80),scenario:str(r.scenario,500),teaser:str(r.teaser,200)||str(r.scenario,120),symptoms:[],related:ids(r.related).slice(0,6),kw:[],status,steps,conclusion:str(r.conclusion,600),lesson:str(r.lesson,400),path:ids(r.path).slice(0,8),review:has(r.review)?r.review:'',created:new Date().toISOString(),query:q};
  const docId='s-'+sid, doc={kind:'scenario',scenario:sc};
  loadCustom({[docId]:doc}); await persist(docId,doc);
  return {scen:sid};
}
async function startGen(kind,q,parent){
  q=String(q||'').trim(); if(!q||!CLOUD.sample||(GEN&&GEN.busy)) return;
  const fromView=state.view;
  GEN={kind,q,parent,busy:true,ctl:new AbortController(),start:Date.now()};
  rerenderKeep();
  try{
    const res=kind==='concept'?await genConcept(q,GEN.ctl.signal,parent):await genScenario(q,GEN.ctl.signal);
    GEN=null;
    if(res.notIT&&parent){rerenderKeep();toast('지도에 추가하지 못했어요. 다시 시도해 주세요.');return}
    if(res.notIT){GEN={kind,q,error:'IT 개념이나 상황으로 보기 어려운 검색어예요. 기술 이름이나 겪고 있는 문제로 다시 입력해 보세요.'};rerenderKeep();return}
    const newId=res.id||res.existing;
    if(newId) INSIGHTS.filter(i=>!i.node&&i.pending&&i.pending.toLowerCase().trim()===q.toLowerCase().trim()).forEach(i=>{i.node=newId;i.pending='';saveInsight(i)});
    const target=res.existing?['detail',{id:res.existing}]:res.id?['detail',{id:res.id}]:['scenario',{id:res.scen}];
    if(state.view===fromView&&!parent){ if(res.existing) toast('이미 지도에 있는 개념이라 그 페이지로 이동했어요.'); go(...target) }
    else { rerenderKeep(); toast(res.scen?'사고 문제를 만들었어요.':'지도에 새 개념을 추가했어요.',`<button class="btn sm primary" id="toastGo">열기</button>`); $('#toastGo').onclick=()=>{$('#toast').hidden=true;go(...target)} }
  }catch(e){
    const code=e&&e.code;
    GEN=code==='cancelled'||parent?null:{kind,q,error:genErr(code)};
    if(parent&&code!=='cancelled') toast(genErr(code));
    rerenderKeep();
  }
}
function rerenderKeep(){ if(state.view==='explore'||state.view==='think'||state.view==='deep'){const y=window.scrollY;render();window.scrollTo(0,y)} }
function genPanel(kind,q){

  return '';
}

/* graph queries */
const prereqs = id=>EDGES.filter(e=>e.s===id&&PRE.has(e.type)).map(e=>({id:e.t,e}));
const nexts   = id=>EDGES.filter(e=>e.t===id&&PRE.has(e.type)).map(e=>({id:e.s,e}));
const related = id=>EDGES.filter(e=>!PRE.has(e.type)&&(e.s===id||e.t===id)).map(e=>({id:e.s===id?e.t:e.s,e}));
function deepPrereqs(id){ // level-2 prerequisites not already in level 1
  const l1=new Set(prereqs(id).map(x=>x.id)); const out=[];
  prereqs(id).forEach(p=>prereqs(p.id).forEach(q=>{if(q.id!==id&&!l1.has(q.id)&&!out.includes(q.id))out.push(q.id)}));
  return out;
}

/* ===================== search ===================== */
function search(qRaw){
  const q=qRaw.toLowerCase().trim(); if(!q) return {nodes:[],scen:[]};
  const toks=q.split(/\s+/).filter(t=>t.length>=2);
  const nodes=NODES.map(n=>{
    let s=0; const nm=n.name.toLowerCase();
    if(nm===q||n.id===q) s+=100;
    else if(q.includes(nm)&&nm.length>=2) s+=50;
    else if(nm.includes(q)) s+=40;
    if(n.full.toLowerCase().includes(q)) s+=20;
    n.kw.forEach(k=>{ if(q.includes(k)) s+=8+k.length*2; else if(k.includes(q)&&q.length>=2) s+=6; });
    INSIGHTS.forEach(i=>{ if(i.node===n.id){const tx=i.text.toLowerCase(); if(tx.includes(q)) s+=12; else toks.forEach(t=>{if(tx.includes(t))s+=3})} });
    toks.forEach(t=>{ if(n.summary.toLowerCase().includes(t)) s+=3; n.concepts.forEach(c=>{if(c.toLowerCase().includes(t))s+=4}); });
    return {n,s};
  }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  const scen=SCENARIOS.map(sc=>({sc,s:sc.kw.reduce((a,k)=>a+(q.includes(k)?k.length:0),0)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  return {nodes,scen};
}

/* ===================== mini ego map ===================== */
function egoMap(id){
  const W=340,H=270,cx=W/2,cy=H/2;
  const pre=prereqs(id).slice(0,4), nx=nexts(id).slice(0,4), rel=related(id).filter(r=>!pre.some(p=>p.id===r.id)&&!nx.some(p=>p.id===r.id)).slice(0,4);
  const pw=t=>Math.max(54,t.length*7.4+22);
  const pos={};
  const row=(arr,y)=>arr.forEach((a,i)=>{const n=arr.length; pos[a.id]={x:W*(i+1)/(n+1),y}});
  row(pre,38); row(nx,H-34);
  rel.forEach((a,i)=>{const left=i%2===0; const k=Math.floor(i/2); pos[a.id]={x:left?52:W-52,y:cy+(k===0?0:(k===1?-38:38))*(1)}});
  if(rel.length>2){ /* stagger */ rel.forEach((a,i)=>{pos[a.id].y=cy+(i<2?-20:20)}) }
  const all=[...pre,...nx,...rel];
  let s=`<svg class="ego" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(byId[id].name)} 주변 연결">`;
  s+=`<text class="cap" x="8" y="12">이해하려면 ↓</text><text class="cap" x="8" y="${H-4}">이해하면 ↑</text>`;
  all.forEach(a=>{const p=pos[a.id]; s+=`<path class="e ${pre.includes(a)?'pre':''}" d="M${cx},${cy} L${p.x},${p.y}"/>`});
  const box=(nid,x,y,center)=>{const t=byId[nid].name, w=pw(t); return `<g class="n ${center?'center':''}" ${center?'':`data-open="${nid}"`} tabindex="0"><rect x="${x-w/2}" y="${y-14}" width="${w}" height="28" rx="14"/><text x="${x}" y="${y+4}" text-anchor="middle">${esc(t)}</text></g>`};
  all.forEach(a=>{s+=box(a.id,pos[a.id].x,pos[a.id].y,false)});
  s+=box(id,cx,cy,true);
  return s+'</svg>';
}

/* ===================== FORCE GRAPH ===================== */
let gid=0;
function forceGraph(el,opt){
  el.querySelector('svg.graph')?.remove();
  const uid=++gid;
  const W=el.clientWidth||800, H=el.clientHeight||560;
  const nodes=opt.nodes.map(n=>({...n}));
  const links=opt.links.map(e=>({e,type:e.type,source:e.s,target:e.t}));
  const deg={}; opt.links.forEach(l=>{deg[l.s]=(deg[l.s]||0)+1;deg[l.t]=(deg[l.t]||0)+1});
  nodes.forEach(n=>n.r=9+Math.min(13,(deg[n.id]||0)*1.7));
  const svg=d3.select(el).insert('svg',':first-child').attr('class','graph'+(opt.cls?' '+opt.cls:'')).attr('viewBox',[0,0,W,H]);
  const defs=svg.append('defs');
  [['a','arrowhead'],['h','arrowhead hot']].forEach(([k,c])=>defs.append('marker').attr('id',`ar${k}${uid}`).attr('viewBox','0 -5 10 10').attr('refX',9).attr('refY',0).attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto').append('path').attr('d','M0,-4L10,0L0,4').attr('class',c));
  const root=svg.append('g');
  const zoom=d3.zoom().scaleExtent([.35,3]).on('zoom',ev=>root.attr('transform',ev.transform));
  svg.call(zoom).on('dblclick.zoom',null);
  const linkG=root.append('g').selectAll('g').data(links).join('g').attr('class',d=>'link t-'+d.type+(d.e.user?' user':''));
  const vis=linkG.append('line').attr('class','vis').attr('marker-end',`url(#ara${uid})`);
  linkG.append('line').attr('class','hit').on('click',(ev,d)=>{ev.stopPropagation();selEdge(d.e);opt.onEdge&&opt.onEdge(d.e)});
  const lab=linkG.append('text').attr('class','elabel').attr('text-anchor','middle').text(d=>d.type);
  let selected=null, selectedEdge=null;
  const drag=d3.drag().clickDistance(4)
    .on('start',(ev,d)=>{if(!ev.active)sim.alphaTarget(.25).restart();d.fx=d.x;d.fy=d.y})
    .on('drag',(ev,d)=>{d.fx=ev.x;d.fy=ev.y})
    .on('end',(ev,d)=>{if(!ev.active)sim.alphaTarget(0);d.fx=null;d.fy=null});
  const nodeG=root.append('g').selectAll('g').data(nodes).join('g')
    .attr('class',d=>`node cat-${d.cats[0]} ${opt.nodeClass?opt.nodeClass(d):''}`).attr('tabindex',0).attr('role','button').attr('aria-label',d=>d.name)
    .call(drag)
    .on('mouseenter',(ev,d)=>hl(d.id)).on('mouseleave',()=>hl(selected))
    .on('click',(ev,d)=>{ev.stopPropagation();select(d.id);opt.onSelect&&opt.onSelect(d.id)})
    .on('dblclick',(ev,d)=>{ev.stopPropagation();opt.onOpen&&opt.onOpen(d.id)})
    .on('keydown',(ev,d)=>{if(ev.key==='Enter'){opt.onOpen&&opt.onOpen(d.id)}else if(ev.key===' '){ev.preventDefault();select(d.id);opt.onSelect&&opt.onSelect(d.id)}});
  nodeG.append('circle').attr('r',d=>d.r);
  nodeG.append('text').attr('text-anchor','middle').attr('dy',d=>d.r+15).text(d=>d.name);
  svg.on('click',()=>{select(null);selEdge(null);opt.onSelect&&opt.onSelect(null)});
  const sim=d3.forceSimulation(nodes)
    .force('link',d3.forceLink(links).id(d=>d.id).distance(l=>60+l.source.r+l.target.r).strength(.55))
    .force('charge',d3.forceManyBody().strength(-460))
    .force('center',d3.forceCenter(W/2,H/2))
    .force('x',d3.forceX(W/2).strength(.05)).force('y',d3.forceY(H/2).strength(.07))
    .force('collide',d3.forceCollide(d=>d.r+20));
  sim.stop(); for(let i=0;i<260;i++) sim.tick();
  function draw(){
    linkG.each(function(d){
      const s=d.source,t=d.target,dx=t.x-s.x,dy=t.y-s.y,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;
      const x1=s.x+ux*s.r,y1=s.y+uy*s.r,x2=t.x-ux*(t.r+3),y2=t.y-uy*(t.r+3);
      d3.select(this).selectAll('line').attr('x1',x1).attr('y1',y1).attr('x2',x2).attr('y2',y2);
      d3.select(this).select('text').attr('x',(x1+x2)/2).attr('y',(y1+y2)/2-4);
    });
    nodeG.attr('transform',d=>`translate(${d.x},${d.y})`);
  }
  sim.on('tick',draw); draw();
  // fit to view
  const xs=nodes.map(n=>n.x),ys=nodes.map(n=>n.y);
  const bx=[Math.min(...xs)-50,Math.max(...xs)+50],by=[Math.min(...ys)-40,Math.max(...ys)+50];
  const k=Math.min(1.25,Math.min(W/(bx[1]-bx[0]),H/(by[1]-by[0])));
  const fitT=d3.zoomIdentity.translate(W/2,H/2).scale(k).translate(-(bx[0]+bx[1])/2,-(by[0]+by[1])/2);
  svg.call(zoom.transform,fitT);
  function hl(id){
    if(!id){nodeG.classed('dim',false).classed('hot',false);linkG.classed('dim',false).classed('hot',false);vis.attr('marker-end',`url(#ara${uid})`);return}
    const nb=new Set([id]); links.forEach(l=>{if(l.source.id===id)nb.add(l.target.id);if(l.target.id===id)nb.add(l.source.id)});
    nodeG.classed('dim',d=>!nb.has(d.id)).classed('hot',d=>d.id===id);
    const on=l=>l.source.id===id||l.target.id===id;
    linkG.classed('dim',l=>!on(l)).classed('hot',on);
    vis.attr('marker-end',l=>on(l)?`url(#arh${uid})`:`url(#ara${uid})`);
  }
  function select(id){selected=id;nodeG.classed('sel',d=>d.id===id);if(id)selEdge(null,true);hl(id)}
  function selEdge(e,silent){selectedEdge=e;linkG.classed('sel',l=>l.e===e);if(e&&!silent){selected=null;nodeG.classed('sel',false);hl(null)}}
  return {
    focus(id){const n=nodes.find(x=>x.id===id);if(!n)return;select(id);svg.transition().duration(650).call(zoom.transform,d3.zoomIdentity.translate(W/2-(W>700?140:0),H/2-(W>700?0:80)).scale(1.35).translate(-n.x,-n.y))},
    select, fit(){svg.transition().duration(500).call(zoom.transform,fitT)},
    zoomBy(f){svg.transition().duration(250).call(zoom.scaleBy,f)},
    filter(cat){nodeG.classed('faded',d=>cat&&!d.cats.includes(cat));linkG.classed('faded',l=>cat&&!(l.source.cats.includes(cat)||l.target.cats.includes(cat)))},
    restyle(fn){nodeG.attr('class',d=>`node cat-${d.cats[0]} ${fn(d)} ${d.id===selected?'sel':''}`)},
    destroy(){sim.stop()}
  };
}

let G=null; // game state
function viewScenario(){
  const s=SCN[state.id]; if(!s) return viewThink();
  if(!G||G.id!==s.id) G=newGame(s);
  const head=`<div class="game-head"><button class="btn ghost sm" data-nav="think" style="align-self:flex-start;margin-left:-10px">← 사고 문제 목록</button><span class="eyebrow" style="color:var(--accent)">${esc(s.kindLabel)}</span><h1>${esc(s.title)}</h1><p class="scenario">${esc(s.scenario)}</p></div>`;
  return `<div class="wrap">${head}${s.kind==='troubleshoot'?gameTS(s):s.kind==='impact'?gameImpact(s):gameTree(s)}</div>`;
}
function newGame(s){
  if(s.kind==='troubleshoot') return {id:s.id,step:0,status:s.status.map(x=>({...x})),tried:{},log:[],fresh:new Set(),done:false};
  if(s.kind==='impact') return {id:s.id,picked:new Set(),checked:false};
  return {id:s.id,place:{},sel:null,checked:false,phase:1,final:null};
}
const MK={ok:['ok','✓'],unk:['unk','?'],bad:['bad','✕']};
function gameTS(s){
  const st=G.step<s.steps.length?s.steps[G.step]:null;
  const statusHTML=`<div class="card" style="padding:16px"><span class="label">현재 확인된 정보</span><div class="statuslist" style="margin-top:8px">${G.status.map(x=>`<div class="${G.fresh.has(x.k)?'new':''}"><span class="mk ${MK[x.s][0]}">${MK[x.s][1]}</span>${esc(x.k)}<small>${esc(x.v||'')}</small></div>`).join('')}</div></div>`;
  let main='';
  if(st){
    const tried=G.tried[G.step]||[];
    const last=tried.length?st.options[tried[tried.length-1]]:null;
    const solved=last&&last.ok;
    main=`<div class="card qbox"><span class="label">단계 ${G.step+1} / ${s.steps.length}</span><div class="qtext">${esc(st.q)}</div>${st.clue?`<div class="clue">${esc(st.clue)}</div>`:''}
      <div class="opts">${st.options.map((o,i)=>{const t=tried.includes(i);const cls=t?(o.ok?'right':'wrong'):'';return `<button class="opt ${cls}" data-opt="${i}" ${t||solved?'disabled':''}>${esc(o.label)}<small>${esc(o.sub||'')}</small></button>`}).join('')}</div>
      ${last?`<div class="fb">${last.result?`<div class="term">${esc(last.result)}</div>`:''}${last.headline?`<div style="font-weight:700;color:${last.ok?'var(--err-text)':'inherit'}">${esc(last.headline)}</div>`:''}<div class="coach ${last.ok?'':'bad'}">${esc(last.coach)}</div>${solved?`<div><button class="btn primary" id="nextStep">${G.step+1<s.steps.length?'다음 단계 →':'결론 보기 →'}</button></div>`:'<p class="muted" style="font-size:13.5px">다른 선택지를 골라보세요. 틀린 시도도 사고 과정에 기록됩니다.</p>'}</div>`:''}
    </div>`;
  } else {
    const wrong=G.log.filter(l=>!l.ok).length;
    main=`<div class="card qbox"><span class="label" style="color:var(--ok-text)">원인 확정</span><div class="qtext">${esc(s.conclusion)}</div>
      <div class="oneliner" style="font-size:15px"><span class="label">배운 것</span>${esc(s.lesson)}</div>
      <div><span class="label">내 사고 과정 · 시도 ${G.log.length}회, 우회 ${wrong}회</span><div class="log" style="margin-top:8px">${G.log.map(l=>`<div><span class="mk ${l.ok?'ok':'bad'}" style="width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700">${l.ok?'✓':'✕'}</span><span><b>${esc(l.label)}</b> <span class="muted">— ${esc(l.q)}</span></span></div>`).join('')}</div></div>
      ${s.path.filter(has).length?`<div><span class="label">요청 경로 (앞에서부터 따라가기)</span><div class="chain" style="margin-top:8px">${s.path.filter(has).map((id,i)=>`${i?'<span class="sep">→</span>':''}<button class="chip" data-open="${id}">${esc(byId[id].name)}</button>`).join('')}</div></div>`:''}
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="retry">다시 풀기</button>${has(s.review||'dns')?`<button class="btn primary" data-open="${s.review||'dns'}">${esc(byId[s.review||'dns'].name)} 개념 복습하기</button>`:''}${s.ai?'<button class="btn ghost" id="delScen">이 문제 삭제</button>':''}</div></div>`;
  }
  return `<div class="game">${statusHTML}${main}</div>`;
}
function gameImpact(s){
  const chk=G.checked;
  const res=chk?s.opts.map(o=>{const p=G.picked.has(o.id);return {o,cls:o.hit&&p?'hit':o.hit&&!p?'miss':!o.hit&&p?'false':''}}):null;
  const perfect=chk&&res.every(r=>r.cls===''||r.cls==='hit');
  return `<div class="card qbox"><span class="label">영향을 받는 것을 모두 선택하세요</span>
    <div class="pickgrid">${s.opts.map(o=>{const r=res?.find(x=>x.o===o);return `<button class="pick ${chk?(r.cls||''):(G.picked.has(o.id)?'on':'')}" data-pick="${o.id}" ${chk?'disabled':''} aria-pressed="${G.picked.has(o.id)}">${esc(o.label)}</button>`}).join('')}</div>

function gameTree(s){
  const pool=s.cands.filter(c=>!G.place[c.id]);
  const branchHTML=s.branches.map(b=>{
    const items=s.cands.filter(c=>G.place[c.id]===b.id);
    return `<div class="cbranch ${G.sel&&!G.checked?'armed':''}" data-branch="${b.id}" role="button" tabindex="0" aria-label="${b.name}에 놓기"><h4>${b.name}<button class="why-btn" data-open="${b.node}">개념</button></h4><div class="slots">${items.map(c=>`<button class="cand ${G.checked?(c.b===b.id?'good':'bad'):''}" data-cand="${c.id}" ${G.checked?'disabled':''}>${esc(c.label)}${G.checked&&c.b!==b.id?` <span style="font-size:12px">→ ${s.branches.find(x=>x.id===c.b).name}</span>`:''}</button>`).join('')}${!items.length?'<span class="muted" style="font-size:13px">후보를 선택한 뒤 여기를 누르세요</span>':''}</div></div>`;
  }).join('');
  let below='';
  if(!G.checked){
    below=`<div class="pool" aria-label="원인 후보">${pool.length?pool.map(c=>`<button class="cand ${G.sel===c.id?'sel':''}" data-cand="${c.id}">${esc(c.label)}</button>`).join(''):'<span class="muted" style="font-size:13px">모든 후보를 배치했습니다.</span>'}</div>
     <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn primary" id="checkTree" ${pool.length?'disabled':''}>사고 트리 확인하기</button><span class="muted" style="font-size:13px">${pool.length?`남은 후보 ${pool.length}개 · 후보를 누르고 → 계층을 누르세요`:''}</span></div>`;
  } else {
    const right=s.cands.filter(c=>G.place[c.id]===c.b).length;
    below=`<div class="coach" style="padding:12px 14px;border-radius:10px;background:var(--primary-soft);border-left:3px solid var(--primary)">${right}/${s.cands.length}개를 올바른 계층에 배치했습니다. 이제 측정값으로 가지를 쳐 봅시다.</div>
     <div><span class="label">측정 결과</span><div class="metrics" style="margin-top:8px">${s.metrics.map(m=>`<div class="metric ${m.bad?'bad':''}"><span>${esc(m.k)}</span><b>${esc(m.v)}</b></div>`).join('')}</div></div>
     <div><span class="label">슬로우 쿼리 로그</span><div class="term" style="margin-top:8px">${esc(s.slowlog)}</div></div>
     <div class="qtext" style="font-size:17px;font-weight:700">${esc(s.finalQ)}</div>
     <div class="pickgrid">${s.cands.map(c=>`<button class="pick ${G.final===c.id?(c.id===s.finalAns?'hit':'false'):''}" data-final="${c.id}" ${G.final===s.finalAns?'disabled':''}>${esc(c.label)}</button>`).join('')}</div>
     ${G.final?`<div class="fb"><div class="coach ${G.final===s.finalAns?'':'bad'}">${esc(s.finalWhy[G.final])}</div>${G.final===s.finalAns?`<div class="oneliner" style="font-size:15px"><span class="label">배운 것</span>${esc(s.lesson)}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="retry">다시 풀기</button><button class="btn primary" data-open="index">Index 개념 보기</button><button class="btn" data-open="sql">SQL 개념 보기</button></div>`:''}</div>`:''}`;
  }
  return `<div class="card qbox"><span class="label">사고 트리 만들기</span>
    <div class="croot"><b>서비스 느림</b><svg viewBox="0 0 520 34" preserveAspectRatio="none"><path d="M260 0 V14 M86 14 H434 M86 14 V34 M260 14 V34 M434 14 V34"/></svg></div>
    <div class="ctree">${branchHTML}</div>${below}</div>`;
}
after.scenario=()=>{
  const s=SCN[state.id]; if(!s) return;
  const rr=()=>{const y=window.scrollY;render();window.scrollTo(0,y)};
  $('#retry')?.addEventListener('click',()=>{G=newGame(s);rr()});
  const ds=$('#delScen'); if(ds) ds.addEventListener('click',()=>{ if(ds.dataset.armed){removeCustomScenario(s.id);G=null;go('think')} else {ds.dataset.armed='1';ds.textContent='한 번 더 누르면 삭제됩니다';ds.style.color='var(--err-text)'} });
  if(s.kind==='troubleshoot'){
    $$('[data-opt]').forEach(b=>b.addEventListener('click',()=>{
      const i=+b.dataset.opt, st=s.steps[G.step], o=st.options[i];
      (G.tried[G.step]=G.tried[G.step]||[]).push(i);
      G.log.push({label:o.label,ok:o.ok,q:st.q});
      G.fresh=new Set();
      if(o.ok&&o.reveal) o.reveal.forEach(r=>{const x=G.status.find(y=>y.k===r.k); if(x){x.s=r.s;x.v=r.v;G.fresh.add(r.k)}});
      rr();
    }));
    $('#nextStep')?.addEventListener('click',()=>{G.step++;G.fresh=new Set();rr()});
  } else if(s.kind==='impact'){
    $$('[data-pick]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.pick;G.picked.has(id)?G.picked.delete(id):G.picked.add(id);rr()}));
    $('#checkImpact')?.addEventListener('click',()=>{G.checked=true;rr()});
  } else {
    $$('.pool [data-cand]').forEach(b=>b.addEventListener('click',()=>{G.sel=G.sel===b.dataset.cand?null:b.dataset.cand;rr()}));
    $$('.cbranch [data-cand]').forEach(b=>b.addEventListener('click',ev=>{ev.stopPropagation();if(G.checked)return;delete G.place[b.dataset.cand];rr()}));
    $$('[data-branch]').forEach(b=>{const place=ev=>{if(ev.target.closest('[data-open]')||!G.sel||G.checked)return;G.place[G.sel]=b.dataset.branch;G.sel=null;rr()};b.addEventListener('click',place);b.addEventListener('keydown',ev=>{if(ev.key==='Enter')place(ev)})});
    $('#checkTree')?.addEventListener('click',()=>{G.checked=true;rr()});
    $$('[data-final]').forEach(b=>b.addEventListener('click',()=>{G.final=b.dataset.final;rr()}));
  }
};

function analysis(){
  const warns=[];
  NODES.forEach(n=>{const st=STATUS[n.id]; if(st==='learning'||st==='known'){
    prereqs(n.id).forEach(p=>{const ps=STATUS[p.id]; if(!ps||ps==='weak') warns.push({n,p:byId[p.id],ps:ps||'none'})});
  }});
  const ready=NODES.filter(n=>!STATUS[n.id]&&prereqs(n.id).every(p=>STATUS[p.id]==='known')).sort((a,b)=>a.diff-b.diff);
  return {warns,ready};
}

async function aiOrganize(raw,nodeId,signal){
  const here=nodeId&&byId[nodeId];
  const prompt=`당신은 개인 IT 학습 지도 "IT MAP"의 정리 도우미입니다. 학습자가 강의·영상·대화에서 듣고 알게 된 내용을 메모했습니다.
원문:
"""
${raw}
"""
${here?`이 메모는 "${here.name}" 개념 페이지에서 적었습니다. 특별한 이유가 없으면 이 개념(id: ${here.id})에 넣으세요.`:''}

지도에 있는 개념 (id: 이름):
${NODES.map(m=>m.id+': '+m.name).join('\n')}

할 일:
1. items: 원문을 개념별 노트로 정리. 주제가 하나면 1개, 여러 개념을 다루면 개념마다 나눠서(최대 4개).
   - text: 학습자가 나중에 다시 읽기 좋은 깔끔한 한국어 1~4문장. 원문의 의미를 바꾸거나 원문에 없는 정보를 지어내지 마세요. 원문의 비유나 예시는 살리세요.
   - node: 가장 알맞은 기존 개념 id. 주제가 지도에 없는 개념이면 node는 null, newConcept에 그 개념 이름(짧게).
   - check: 원문에 사실과 다르거나 오해하기 쉬운 부분이 있으면 1~2문장으로 부드럽게 바로잡기. 없으면 "".
2. links: 원문이 두 '기존' 개념 사이의 관계를 말하고 있다면 그 관계(0~3개). 원문에 근거가 없으면 비워두세요.
   {"s":"출발 id","t":"도착 id","type":"depends_on|built_on|part_of|used_with|related_to|alternative_to|affected_by|causes","why":"1문장","sr":"출발 쪽 역할(12자 이내)","tr":"도착 쪽 역할(12자 이내)"}
   (A depends_on B = A를 이해하려면 B가 필요)

JSON 하나만 출력:
{"items":[{"node":null,"newConcept":"","text":"","check":""}],"links":[]}`;
  const r=await CLOUD.sample.json(prompt,{signal,modelTier:'default'});
  const arr=v=>Array.isArray(v)?v:[];
  const items=arr(r&&r.items).slice(0,4).map(it=>{const node=has(it&&it.node)?it.node:null;const nc=node?'':str(it&&it.newConcept,40);return {node,newConcept:nc,text:str(it&&it.text,1500),check:str(it&&it.check,500),on:true,sel:node||(nc?'new:'+nc:(nodeId||''))}}).filter(it=>it.text);
  if(!items.length) throw {code:'bad_shape'};
  const links=arr(r&&r.links).filter(l=>l&&has(l.s)&&has(l.t)&&l.s!==l.t&&GEN_TYPES.includes(l.type)&&!EDGES.some(e=>(e.s===l.s&&e.t===l.t)||(e.s===l.t&&e.t===l.s))).slice(0,3).map(l=>({s:l.s,t:l.t,type:l.type,why:str(l.why,300),sr:str(l.sr,40),tr:str(l.tr,40),on:true}));
  return {items,links};
}
function onSameView(where,nodeId){return where==='detail'?(state.view==='detail'&&state.id===nodeId):state.view==='notes'}
async function runOrganize(where,nodeId,raw,source){
  if(!CLOUD.sample||(ORG&&ORG.busy)) return;
  ORG={where,nodeId,raw,source,busy:true,ctl:new AbortController()};
  rerender(); $('#capForm')?.scrollIntoView?.({block:'nearest'});
  try{
    const result=await aiOrganize(raw,nodeId,ORG.ctl.signal);
    ORG={where,nodeId,raw,source,result};
  }catch(e){
    ORG=e&&e.code==='cancelled'?null:{where,nodeId,raw,source,error:genErr(e&&e.code)};
  }
  if(onSameView(where,nodeId)) rerender(); else if(ORG&&ORG.result) toast('AI 정리가 끝났어요. 노트를 쓰던 화면에서 확인하고 저장하세요.');
}
function wireCapture(where,nodeId){
  const key=where+':'+(nodeId||'');
  const f=$('#capForm');

    const sync=()=>{DRAFT[key]={raw:$('#capText').value,source:$('#capSrc').value,node:$('#capNode')?.value||''}};
    f.addEventListener('input',sync); f.addEventListener('change',sync);
    f.addEventListener('submit',e=>{e.preventDefault();const text=$('#capText').value.trim();if(!text){$('#capText').focus();return}

      addInsight({node,text,raw:text,source:$('#capSrc').value.trim()});DRAFT[key]=null;

    $('#capAI')?.addEventListener('click',()=>{const text=$('#capText').value.trim();if(!text){$('#capText').focus();return}sync();runOrganize(where,nodeId,text,$('#capSrc').value.trim())});
  }
  $('#orgCancel')?.addEventListener('click',()=>ORG&&ORG.ctl&&ORG.ctl.abort());
  $('#orgBack')?.addEventListener('click',()=>{ORG=null;rerender()});
  $('#orgRetry')?.addEventListener('click',()=>{const o=ORG;ORG=null;runOrganize(o.where,o.nodeId,o.raw,o.source)});
  $$('[data-oinode]').forEach(s=>s.addEventListener('change',()=>{ORG.result.items[+s.dataset.oinode].sel=s.value}));
  $$('[data-oitext]').forEach(t=>t.addEventListener('input',()=>{ORG.result.items[+t.dataset.oitext].text=t.value}));

  $$('[data-olink]').forEach(c=>c.addEventListener('change',()=>{ORG.result.links[+c.dataset.olink].on=c.checked}));
  $('#orgSave')?.addEventListener('click',()=>{

    ORG.result.items.forEach(it=>{ if(!it.on||!it.text.trim())return; const v=it.sel||''; const isNew=v.startsWith('new:');
      addInsight({node:!isNew&&has(v)?v:null,pending:isNew?v.slice(4):'',text:it.text.trim(),raw:ORG.raw,source:ORG.source,check:it.check});n++});
    ORG.result.links.forEach(x=>{ if(x.on&&has(x.s)&&has(x.t)&&!EDGES.some(e=>e.s===x.s&&e.t===x.t)){addUserEdge(x);l++} });
    ORG=null; DRAFT[key]=null;
    toast(`노트 ${n}개${l?`, 새 연결 ${l}개`:''}를 저장했어요.`); rerender();
  });
}

/* --- diagram blocks --- */
const DIAGRAMS={flow:dgFlow,layers:dgLayers,compare:dgCompare,seq:dgSeq,hub:dgHub};
function dgHead(lines){let title='';const rest=[];lines.forEach(l=>{const t=l.trim();if(!t)return;const m=t.match(/^(제목|title)\s*[:：]\s*(.*)/i);if(m&&!title)title=m[2];else rest.push(t)});return {title,rest}}
function safeDiagram(lang,buf){try{const h=DIAGRAMS[lang](buf);if(h)return h}catch(e){}return `<pre class="code"><code>${esc(buf.join('\n'))}</code></pre>`}
const cells=l=>{const a=l.split('|').map(s=>s.trim());if(a[0]==='')a.shift();if(a.length&&a[a.length-1]==='')a.pop();return a};
const fig=(cls,title,inner)=>`<figure class="dg ${cls}">${title?`<figcaption>${inl(title)}</figcaption>`:''}${inner}</figure>`;
function dgFlow(buf){const {title,rest}=dgHead(buf);const steps=rest.map(l=>cells(l.replace(/^\d+[.)]\s*/,'').replace(/^[-*]\s*/,''))).filter(c=>c.length&&c[0]);if(!steps.length)return null;
  return fig('flow'+(steps.length>5?' vert':''),title,`<div class="flowwrap"><ol class="flowsteps">${steps.map((c,k)=>`<li><span class="fn">${k+1}</span><div class="fbody">${c.length>1?`<b>${inl(c[0])}</b><span>${inl(c.slice(1).join(' · '))}</span>`:`<span>${inl(c[0])}</span>`}</div></li>`).join('')}</ol></div>`)}
function dgLayers(buf){const {title,rest}=dgHead(buf);const rows=rest.map(cells).filter(c=>c.length&&c[0]);if(!rows.length)return null;
  return fig('layers',title,`<div class="lyr">${rows.map(c=>`<div class="lrow"><span class="lname">${inl(c[0])}</span><span class="litems">${(c.slice(1).join(',')).split(/[,，]/).map(s=>s.trim()).filter(Boolean).map(s=>`<span>${inl(s)}</span>`).join('')}</span></div>`).join('')}</div>`)}
function dgCompare(buf){const {title,rest}=dgHead(buf);const rows=rest.filter(l=>!/^\|?\s*:?-{2,}/.test(l)).map(cells).filter(c=>c.length>1);if(rows.length<2)return null;const [h,...b]=rows;const n=h.length;
  return fig('compare',title,`<div class="cmpwrap"><table class="cmp"><thead><tr>${h.map((x,k)=>`<th class="${k?'col':''}">${inl(x)}</th>`).join('')}</tr></thead><tbody>${b.map(r=>`<tr>${Array.from({length:n},(_,k)=>k?`<td>${inl(r[k]||'')}</td>`:`<th>${inl(r[k]||'')}</th>`).join('')}</tr>`).join('')}</tbody></table></div>`)}
function dgHub(buf){const {title,rest}=dgHead(buf);let center='';const items=[];
  rest.forEach(l=>{const m=l.match(/^(중심|center)\s*[:：]\s*(.*)/i);if(m)center=m[2];else{const c=cells(l.replace(/^[-*]\s*/,''));if(c[0])items.push(c)}});
  if(!center&&items.length)center=items.shift()[0];if(!items.length)return null;
  return fig('hub',title,`<div class="hubc"><div class="hubcenter">${inl(center)}</div><div class="hubrail"></div><div class="hubitems">${items.map(c=>`<div class="hubitem"><b>${inl(c[0])}</b>${c[1]?`<span>${inl(c.slice(1).join(' · '))}</span>`:''}</div>`).join('')}</div></div>`)}
function dgSeq(buf){const {title,rest}=dgHead(buf);let parts=[];const msgs=[];
  rest.forEach(l=>{const pp=l.match(/^(참여자|participants)\s*[:：]\s*(.*)/i);if(pp){parts=pp[2].split(/[,，]/).map(s=>s.trim()).filter(Boolean);return}
    const m=l.replace(/^\d+[.)]\s*/,'').match(/^(.+?)\s*(-->>|->>|-->|->|=>|→)\s*(.+?)\s*[:：]\s*(.*)$/);if(m)msgs.push({a:m[1].trim(),b:m[3].trim(),dash:m[2].startsWith('--'),t:m[4].trim()})});
  if(!msgs.length)return null;
  msgs.forEach(x=>[x.a,x.b].forEach(nm=>{if(!parts.includes(nm))parts.push(nm)}));parts=parts.slice(0,8);
  const COL=150,PAD=12,W=PAD*2+COL*parts.length,top=48,ROW=48,H=top+msgs.length*ROW+14;
  const X=nm=>PAD+COL*parts.indexOf(nm)+COL/2;
  const tr=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
  let s=`<svg class="seqsvg" viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;min-width:${Math.round(W*0.85)}px;height:auto" role="img" aria-label="${esc(title||'순서도')}"><defs><marker id="sqa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" class="sqah"/></marker></defs>`;
  parts.forEach(pt=>{const x=X(pt);s+=`<line class="sql" x1="${x}" y1="${top-10}" x2="${x}" y2="${H-6}"/><rect class="sqp" x="${x-COL/2+10}" y="6" width="${COL-20}" height="32" rx="9"/><text class="sqpt" x="${x}" y="27" text-anchor="middle">${esc(tr(pt,13))}</text>`});
  msgs.forEach((m,k)=>{if(!parts.includes(m.a)||!parts.includes(m.b))return;const y=top+ROW*k+30,x1=X(m.a),x2=X(m.b);
    if(x1===x2){s+=`<path class="sqm${m.dash?' dash':''}" d="M${x1},${y-10} h36 v18 h-32" marker-end="url(#sqa)"/><text class="sqt" x="${x1+44}" y="${y+4}">${esc(tr(m.t,9))}</text>`}
    else{const span=Math.abs(x2-x1);s+=`<line class="sqm${m.dash?' dash':''}" x1="${x1}" y1="${y}" x2="${x2+(x2>x1?-3:3)}" y2="${y}" marker-end="url(#sqa)"/><text class="sqt" x="${(x1+x2)/2}" y="${y-8}" text-anchor="middle">${esc(tr(m.t,Math.max(8,Math.floor(span/12))))}</text><circle class="sqc" cx="${x1}" cy="${y}" r="9"/><text class="sqn" x="${x1}" y="${y+3.5}" text-anchor="middle">${k+1}</text>`}});
  return fig('seq',title,`<div class="seqwrap">${s}</svg></div><details class="seqlist"><summary>단계별 글로 보기</summary><ol>${msgs.map(m=>`<li><b>${esc(m.a)}</b> → <b>${esc(m.b)}</b>: ${inl(m.t)}</li>`).join('')}</ol></details>`)}
function inl(s){
  let h=esc(s);
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/\[\[([^\]]{1,60})\]\]/g,(m,name)=>termLink(name));
  return h;
}
function md(text,parent){
  MDCTX.parent=parent||null;
  const lines=String(text||'').replace(/\r/g,'').split('\n'); let out='',i=0,list=null,m,m2;
  const close=()=>{if(list){out+=`</${list}>`;list=null}};
  while(i<lines.length){
    const L=lines[i];
    if((m=L.match(/^\s*```\s*([A-Za-z]*)/))){close();const lang=(m[1]||'').toLowerCase();const buf=[];let closed=false;i++;
      while(i<lines.length){if(/^\s*```/.test(lines[i])){closed=true;i++;break}buf.push(lines[i++])}
      out+=DIAGRAMS[lang]?(closed?safeDiagram(lang,buf):'<div class="dg dg-pending">그림을 그리는 중…</div>'):`<pre class="code"><code>${esc(buf.join('\n'))}</code></pre>`;continue}
    if((m=L.match(/^(#{1,4})\s+(.*)/))){close();const lv=Math.min(5,Math.max(3,m[1].length+1));out+=`<h${lv}>${inl(m[2])}</h${lv}>`;i++;continue}
    if((m=L.match(/^\s*\**Q\**\s*\d*[:：.]\s*(.*)/))){close();let a='';if(i+1<lines.length&&(m2=lines[i+1].match(/^\s*\**A\**\s*\d*[:：.]\s*(.*)/))){a=m2[1];i++}
      out+=`<div class="qa"><p class="qq">${inl(m[1].replace(/\*\*$/,''))}</p>${a?`<details><summary>모범 답 보기</summary><p>${inl(a)}</p></details>`:''}</div>`;i++;continue}
    if((m=L.match(/^\s*[-*•]\s+(.*)/))){if(list!=='ul'){close();out+='<ul>';list='ul'}out+=`<li>${inl(m[1])}</li>`;i++;continue}
    if((m=L.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=='ol'){close();out+='<ol>';list='ol'}out+=`<li>${inl(m[1])}</li>`;i++;continue}
    if((m=L.match(/^>\s?(.*)/))){close();const c=m[1].match(/^\**(비유|핵심|주의|예시|팁)\**\s*[:：]\s*(.*)/);
      out+=c?`<aside class="callout c-${CALLOUT[c[1]]}"><span class="clabel">${c[1]}</span><p>${inl(c[2])}</p></aside>`:`<blockquote>${inl(m[1])}</blockquote>`;i++;continue}
    if((m=L.match(/^\s*(?:[-*•]\s+)?(이미지|그림|문서|영상)\s*[:：]\s*(.+)/))){close();let refs='';
      while(i<lines.length&&(m=lines[i].match(/^\s*(?:[-*•]\s+)?(이미지|그림|문서|영상)\s*[:：]\s*(.+)/))){refs+=refLink(m[1],m[2]);i++}
      out+=`<div class="refs">${refs}</div>`;continue}
    if(/^\s*(---|\*\*\*)\s*$/.test(L)){close();out+='<hr>';i++;continue}
    if(!L.trim()){close();i++;continue}
    close();out+=`<p>${inl(L)}</p>`;i++;
  }
  close();return out;
}

function splitSections(text){
  const secs=[];let cur={title:'',lines:[]};let inCode=false;
  String(text||'').replace(/\r/g,'').split('\n').forEach(l=>{
    if(/^\s*```/.test(l)) inCode=!inCode;
    if(!inCode&&/^##\s+/.test(l)){ if(cur.title||cur.lines.join('').trim()) secs.push(cur); cur={title:l.replace(/^##\s+/,'').trim(),lines:[]}; }
    else cur.lines.push(l);
  });
  if(cur.title||cur.lines.join('').trim()) secs.push(cur);
  return secs;
}

/* ===================== LEARNING SYSTEM: understanding · connections · gaps · review · open think · My Space ===================== */
const UND={}; let GAPS=[]; const SUGG={}; let REVIEWS=[]; const THINKS={};
const UDRAFT={}, RVD={};
const SOC={}; // concept THINK step socratic turns
let GAPSUG=null; const GAPAI={};
let AIB=null; // single AI job {key,busy,ctl,text}
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const strip=o=>{const {docId,_new,...r}=o;return r};
const saveDoc=o=>persist(o.docId,strip(o));
const nowISO=()=>new Date().toISOString();
const byNewest=k=>(a,b)=>String(b[k]).localeCompare(String(a[k]));
const arrOf=v=>Array.isArray(v)?v:[];
const strs=(v,n,max)=>arrOf(v).map(x=>str(typeof x==='string'?x:'',max||200)).filter(Boolean).slice(0,n);

function loadExtra(k,d){
  if(!d||!d.kind) return;
  if(d.kind==='und'&&d.node) UND[d.node]={...d,docId:k};
  else if(d.kind==='gap'&&!GAPS.some(g=>g.docId===k)) GAPS.push({...d,docId:k});
  else if(d.kind==='sg'&&d.node) SUGG[d.node]={...d,docId:k};
  else if(d.kind==='rv'&&!REVIEWS.some(r=>r.docId===k)) REVIEWS.push({...d,docId:k});
  else if(d.kind==='th'&&d.id) THINKS[d.id]={...d,docId:k};
}

/* ---------- level ---------- */
function lastReview(id){return REVIEWS.filter(r=>r.node===id).sort(byNewest('at'))[0]}
function levelOf(id){
  const r=REVIEWS.filter(x=>x.node===id&&x.fb&&x.fb.score).sort(byNewest('at'))[0]; if(r) return r.fb.score;
  const u=UND[id]; if(u&&u.fb&&u.fb.level) return u.fb.level;
  return {known:3,learning:2,weak:1}[STATUS[id]]||0;
}
function lvBadge(id){const l=levelOf(id);return `<span class="lv lv${l}" title="이해도 레벨 (복습·이해도 피드백 기준)">이해도 Lv.${l}</span>`}

function aiBusy(msg){return `<div class="aicard busy" aria-live="polite"><div class="aitext"><span class="label" style="color:var(--accent)">AI 분석 중</span><b>${esc(msg)}</b><span class="muted" style="font-size:12.5px">보통 10~40초 걸려요</span><div class="pbar"><i></i></div></div><button class="btn sm" data-aicancel>취소</button></div>`}
async function runAI(key,fn,okMsg){
  if(!CLOUD.sample){toast('AI 기능은 로그인한 상태에서 쓸 수 있어요.');return}
  if(AIB&&AIB.busy){toast('다른 AI 작업이 끝나면 다시 눌러 주세요.');return}
  const at={view:state.view,id:state.id,tab:state.tab};
  AIB={key,busy:true,ctl:new AbortController(),text:''}; rerender();
  let ok=false;
  try{ await fn(AIB.ctl.signal); ok=true }catch(e){ if(!(e&&e.code==='cancelled')) toast(genErr(e&&e.code)) }
  AIB=null;
  const same=state.view===at.view&&state.id===at.id&&state.tab===at.tab;
  if(same) rerender(); else if(ok&&okMsg) toast(okMsg);
  if(ok&&okMsg&&same) toast(okMsg);
}

/* ---------- gaps ---------- */
const GAP_SRC={manual:'직접 추가',ai:'AI가 발견',und:'내 설명에서',note:'노트에서',review:'복습에서',think:'사고 훈련에서',fb:'AI 피드백에서'};
const openGaps=()=>GAPS.filter(g=>!g.done);
function addGap({text,node,source,why}){
  text=String(text||'').trim(); if(text.length<2) return null;
  if(GAPS.some(g=>!g.done&&g.text===text)) return null;
  const g={docId:uid('g-'),kind:'gap',text:text.slice(0,300),node:has(node)?node:null,source:source||'manual',why:why||'',done:false,created:nowISO()};
  GAPS.push(g); saveDoc(g); return g;
}
function gapChips(list,node,source){
  if(!list||!list.length) return '';
  return `<div><span class="label">지식 공백 후보</span><div class="chips" style="margin-top:8px">${list.map(t=>{const added=GAPS.some(g=>g.text===t);return `<button class="chip gapchip" data-addgap="${esc(t)}" data-gapnode="${node||''}" data-gapsrc="${source||'fb'}" ${added?'disabled':''}>${added?'✓ ':'+ '}${esc(t)}</button>`}).join('')}</div></div>`;
}

/* ---------- My Understanding (Deep Understanding) ---------- */
const UF=[['what','무엇인가?','처음 듣는 사람에게 설명하듯 한두 문장으로'],['why','왜 필요한가?','이게 없으면 어떤 문제가 생기나요?'],['how','어떻게 동작하는가?','안에서 실제로 무슨 일이 일어나나요? (단계, 구성요소, 데이터 흐름)'],['conn','무엇과 연결되는가?','어떤 개념 위에 있고, 무엇과 함께 쓰이나요?'],['trouble','문제가 생기면?','어떤 증상이 나타나고 무엇이 영향을 받나요?'],['unknown','아직 모르는 것은?','한 줄에 하나씩 적으면 지식 공백으로 등록돼요']];
function saveUnd(n,fields){
  const prev=UND[n.id]; const u=prev?{...prev}:{docId:'u-'+n.id,kind:'und',node:n.id,history:[],created:nowISO()};
  if(prev&&prev.fields&&JSON.stringify(prev.fields)!==JSON.stringify(fields)){ u.history=[...(prev.history||[]),{at:prev.updated,fields:prev.fields,fb:prev.fb||null}].slice(-10); u.fb=null; }
  u.fields=fields; u.updated=nowISO(); UND[n.id]=u; saveDoc(u);
  let c=0; String(fields.unknown||'').split('\n').map(s=>s.replace(/^[\s\-*•\d.)]+/,'').trim()).filter(s=>s.length>=3).forEach(t=>{if(addGap({text:t,node:n.id,source:'und'}))c++});
  if(!STATUS[n.id]) setStatus(n.id,'learning');
  return c;
}

    ${L(fb.lacking?'아직 부족한 부분':'빠진 부분',fb.lacking||fb.missing,'miss','−')}

async function undFeedback(n,signal){
  const u=UND[n.id];
  const prompt=`당신은 IT 튜터이자 학습 분석가입니다. 학습자가 "${n.name}"을(를) 자기 말로 설명했습니다. 정답을 대신 써 주지 말고, 학습자의 설명을 평가하세요.
(평가 기준 — 학습자에게는 보여주지 않은 참고 정보)
요약: ${n.summary}
무엇: ${n.what}
왜: ${n.why}
핵심 개념: ${n.concepts.join(', ')}
연결된 개념: ${[...prereqs(n.id),...related(n.id)].map(x=>byId[x.id].name).join(', ')}

학습자의 설명:
${UF.map(([k,l])=>`[${l}] ${u.fields[k]||'(비어 있음)'}`).join('\n')}

규칙:
- good: 정확하게 설명한 점 1~3개. 학습자의 문장을 구체적으로 짚으세요.
- missing: 빠진 핵심 1~3개. 답을 알려주지 말고 '무엇이 빠졌는지'만. (예: "TCP가 순서를 어떻게 보장하는지 설명이 없음")
- wrong: 사실과 다른 부분 0~2개. 왜 틀렸는지 힌트만.

async function suggestConn(n,signal){

  const prompt=`당신은 IT 학습 추천자입니다. 학습자가 "${n.name}"을(를) 공부하고 있습니다. 이해를 넓히려면 함께 알아야 하는데 아직 지도에 연결되어 있지 않은 관계를 2~4개 추천하세요.

${ex||'(없음)'}

JSON만: {"items":[{"s":"","t":"","type":"","why":""}]}`;
  const r=await aj(prompt,signal);
  const items=arrOf(r.items).filter(x=>x&&has(x.s)&&has(x.t)&&x.s!==x.t&&(x.s===n.id||x.t===n.id)&&GEN_TYPES.includes(x.type)&&!EDGES.some(e=>(e.s===x.s&&e.t===x.t)||(e.s===x.t&&e.t===x.s))).slice(0,4).map(x=>({s:x.s,t:x.t,type:x.type,why:str(x.why,300),state:'pending'}));
  if(!items.length){toast('지금은 새로 추천할 연결이 없어요.');return}
  const sg=SUGG[n.id]||{docId:'sg-'+n.id,kind:'sg',node:n.id,items:[]};
  sg.items=[...sg.items.filter(x=>x.state!=='pending'),...items].slice(-30); SUGG[n.id]=sg; saveDoc(sg);
}

  return NODES.filter(n=>STATUS[n.id]||UND[n.id]).map(n=>{const r=lastReview(n.id);const lv=levelOf(n.id);const last=r?new Date(r.at).getTime():0;
    return {id:n.id,lv,last,due:!r||STATUS[n.id]==='weak'||(now-last)>=IV[lv]*86400000*0.95}}).sort((a,b)=>a.last-b.last||a.lv-b.lv);
}
function reviewQs(id){
  const n=byId[id]; const qs=[{k:'what',q:`${n.name}란 무엇인가?`,ph:'내 말로 설명하기'}];
  const o=prereqs(id)[0]||related(id)[0]||nexts(id)[0];
  if(o) qs.push({k:'rel',q:`${n.name}와 ${byId[o.id].name}의 관계는?`,ph:'왜 연결되어 있는지 내 말로'});
  if(n.think&&n.think.q) qs.push({k:'think',q:n.think.q,ph:'내 생각 작성'});
  return qs;
}

function saveReview(id,fb){
  const qs=reviewQs(id); const d=RVD[id]||{};
  const rec={docId:uid('rv-'),kind:'rv',node:id,qs:qs.map(q=>({k:q.k,q:q.q})),answers:{...d},fb:fb||null,at:nowISO()};
  REVIEWS.push(rec); saveDoc(rec); RVD[id]={};
  if(fb&&fb.score){ setStatus(id,fb.score>=4?'known':fb.score<=2?'weak':'learning'); }
  return rec;
}
async function reviewAI(id,signal){
  const n=byId[id]; const qs=reviewQs(id); const d=RVD[id]||{};
  const prev=REVIEWS.filter(r=>r.node===id).sort(byNewest('at'))[0]; const u=UND[id];
  const prompt=`당신은 IT 튜터입니다. 학습자가 "${n.name}" 복습 질문에 자기 말로 답했습니다. 정답을 대신 써 주지 말고 평가하세요.
(평가 기준 — 참고용) 요약: ${n.summary} / 무엇: ${n.what} / 왜: ${n.why} / 문제 상황 모범 답: ${n.think&&n.think.a||''}
이번 답:
${qs.map(q=>`Q. ${q.q}\nA. ${d[q.k]||'(비어 있음)'}`).join('\n')}
지난 복습 답 (${prev?fmtDate(prev.at):'없음'}):
${prev?qs.map(q=>`Q. ${q.q}\nA. ${prev.answers&&prev.answers[q.k]||'(없음)'}`).join('\n'):'없음'}
학습자의 이전 정리: ${u?UF.map(([k,l])=>`${l} ${u.fields[k]||''}`).join(' / '):'없음'}
할 일:
- score: 1~5
- improved: ${prev?'지난번보다 좋아진 부분':'이번에 잘 설명한 부분'} 1~3개 (구체적으로)
- lacking: 아직 부족한 부분 1~3개. 답을 주지 말고 무엇이 부족한지만 (예: "TCP의 신뢰성 보장 방식")
- next: 다음에 해 볼 것 1문장
- gaps: 지식 공백 후보 0~2개 (짧은 질문형)
JSON만: {"score":3,"improved":[],"lacking":[],"next":"","gaps":[]}`;
  const r=await aj(prompt,signal);
  const fb={score:Math.min(5,Math.max(1,Math.round(+r.score||2))),improved:strs(r.improved,3),lacking:strs(r.lacking,3),next:str(r.next,300),gaps:strs(r.gaps,2,120)};
  saveReview(id,fb);
}

function activityDays(n){
  const days=[]; const today=new Date(); today.setHours(0,0,0,0);
  for(let i=n-1;i>=0;i--){const d=new Date(today);d.setDate(d.getDate()-i);days.push({d,key:d.toDateString(),c:0})}
  const bump=s=>{if(!s)return;const k=new Date(s);k.setHours(0,0,0,0);const x=days.find(y=>y.key===k.toDateString());if(x)x.c++};
  INSIGHTS.forEach(i=>bump(i.created)); QAS.forEach(q=>bump(q.created)); REVIEWS.forEach(r=>bump(r.at));
  Object.values(UND).forEach(u=>{bump(u.updated);(u.history||[]).forEach(h=>bump(h.at))}); GAPS.forEach(g=>{bump(g.created);bump(g.doneAt)});
  Object.values(THINKS).forEach(t=>t.rounds.forEach(r=>bump(r.at))); Object.values(LESSONS).forEach(l=>bump(l.created));
  return days;
}

  const days=activityDays(14); const mx=Math.max(1,...days.map(d=>d.c)); const lmx=Math.max(1,...lvd);
  const tiles=[['이해한 개념',c.known],['학습 중',c.learning],['내 말로 정리',Object.keys(UND).length],['복습',REVIEWS.length],['해결한 공백',`${GAPS.filter(g=>g.done).length}/${GAPS.length}`],['내 연결',EDGES.filter(e=>e.user).length],['완료한 챕터',chDone],['사고 훈련',Object.values(THINKS).reduce((a,t)=>a+t.rounds.length,0)]];
  return `<div class="wrap"><div class="page-h"><h1>📊 Progress</h1><p class="muted">공부한 내용이 '내 지식'으로 바뀌어 가는 과정이에요.</p></div>
   <div class="tiles">${tiles.map(([l,v])=>`<div class="tile"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
   <div class="progrid">
    <section class="card"><span class="label">최근 14일 학습 활동</span><div class="bars" role="img" aria-label="최근 14일 활동 막대">${days.map(d=>`<div class="barcol" title="${d.d.getMonth()+1}/${d.d.getDate()} · ${d.c}"><span class="bv">${d.c||''}</span><i style="height:${Math.round(d.c/mx*100)}%"></i><small>${d.d.getDate()}</small></div>`).join('')}</div><p class="muted" style="font-size:12px">노트, 질문, 복습, 내 설명, 공백, 사고 훈련, 강의 노트를 하루 단위로 센 값</p></section>
    <section class="card"><span class="label">이해도 레벨 분포</span><div class="lvbars">${lvd.map((v,i)=>`<div class="lvrow"><span class="lv lv${i}">Lv.${i}</span><span class="lvbar"><i style="width:${Math.round(v/lmx*100)}%"></i></span><b>${v}</b></div>`).join('')}</div><p class="muted" style="font-size:12px">복습 점수 → AI 이해도 피드백 → 이해도 표시 순으로 레벨을 정해요</p></section>
   </div></div>`;
}

/* ---------- My Space ---------- */
const SPACE_TABS=[['knowledge','🧠 My Knowledge'],['mymap','🗺️ My Map'],['gaps','🕳️ Knowledge Gaps'],['notes','📝 Notes'],['qa','💬 질문 기록'],['review','🔄 Review'],['progress','📊 Progress']];
function viewSpace(){
  const t=state.tab||'knowledge';
  const cnt={gaps:openGaps().length,review:reviewCands().filter(x=>x.due).length,notes:INSIGHTS.length,qa:QAS.length};
  const bar=`<div class="wrap"><div class="spacehead"><span class="eyebrow">My Space</span><div class="tabs scrolltabs" role="tablist">${SPACE_TABS.map(([k,l])=>`<button role="tab" class="${t===k?'on':''}" aria-selected="${t===k}" data-space="${k}">${l}${cnt[k]?` <span>${cnt[k]}</span>`:''}</button>`).join('')}</div></div></div>`;
  const inner=t==='knowledge'?viewMe():(t==='notes'||t==='qa')?viewNotes():t==='mymap'?viewMyMap():t==='gaps'?viewGaps():t==='review'?viewReview():viewProgress();
  return bar+inner;
}
after.space=()=>{
  const t=state.tab||'knowledge';
  if(t==='knowledge') after.me(); else if(t==='notes'||t==='qa') after.notes(); else if(t==='mymap') afterMyMap();
  else if(t==='gaps'){
    $('#gapForm')?.addEventListener('submit',e=>{e.preventDefault();const g=addGap({text:$('#gapText').value,node:$('#gapNode').value,source:'manual'});if(g){toast('공백을 등록했어요.');rerender()}else $('#gapText').focus()});
    $('#gapScan')?.addEventListener('click',()=>runAI('gapscan',gapScan));
  } else if(t==='review'&&state.rv){
    const id=state.rv;
    $$('[data-rv]').forEach(x=>x.addEventListener('input',()=>{(RVD[id]=RVD[id]||{})[x.dataset.rv]=x.value}));
    const filled=()=>Object.values(RVD[id]||{}).some(v=>String(v).trim());
    $('#rvAI')?.addEventListener('click',()=>{if(!filled()){toast('먼저 답을 하나 이상 써 주세요.');return}runAI('rv:'+id,s=>reviewAI(id,s),'복습을 저장했어요.')});
    $('#rvSave')?.addEventListener('click',()=>{if(!filled()){toast('먼저 답을 하나 이상 써 주세요.');return}saveReview(id,null);toast('복습을 저장했어요.');rerender()});
  }
};

/* ---------- Home ---------- */
function viewHome(){
  const h=new Date().getHours(); const greet=h<5?'늦은 밤이에요':h<12?'좋은 아침이에요':h<18?'좋은 오후예요':'좋은 저녁이에요';
  const contId=[...TRAIL].reverse().find(has)||NODES.find(n=>STATUS[n.id]==='learning')?.id;
  const cont=contId&&byId[contId];
  const gaps=openGaps().sort(byNewest('created')); const due=reviewCands().filter(x=>x.due);
  const lastEdge=[...EDGES].reverse().find(e=>e.user); const tp=todayPreset();
  const lv=cont?levelOf(cont.id):0;
  return `<div class="wrap home2">
   <h1 class="greet">${greet} 👋</h1>
   <div class="hgrid">
    <article class="card hcont">${cont?`<span class="label">오늘 이어서 공부하기</span><h2>${esc(cont.name)}</h2><div class="lvmeter" aria-label="이해도 Lv.${lv}">${[1,2,3,4,5].map(i=>`<i class="${i<=lv?'on':''}"></i>`).join('')}<span>이해도 Lv.${lv}</span></div><p class="muted">${esc(cont.summary)}</p>
      <div class="aibtns"><button class="btn primary" ${COURSES[cont.id]?`data-deep="${cont.id}"`:`data-open="${cont.id}"`}>계속 학습하기 →</button>${UND[cont.id]?'':`<button class="btn" data-und="${cont.id}">내 말로 설명하기</button>`}</div>`
      :`<span class="label">시작하기</span><h2>무엇부터 공부할까요?</h2><div class="chips" style="margin-top:6px">${['http','linux','docker','database'].map(id=>nodeChip(id)).join('')}</div>`}</article>
    <button class="card hcard" data-space="gaps"><span class="label">🕳️ 아직 해결하지 않은 질문</span><b class="big">${gaps.length}<small>개</small></b>${gaps.slice(0,2).map(g=>`<span class="hline">· ${esc(g.text)}</span>`).join('')||'<span class="hline">궁금한 점이 생기면 여기에 모여요</span>'}</button>
    <button class="card hcard" data-space="review"><span class="label">🔄 오늘의 복습</span><b class="big">${due.length}<small>개</small></b><span class="hline">${due.slice(0,3).map(x=>esc(byId[x.id].name)).join(', ')||'오늘 복습할 개념이 없어요'}</span></button>
    <button class="card hcard" data-space="mymap"><span class="label">🔗 최근 추가한 연결</span>${lastEdge?`<b class="mid">${esc(byId[lastEdge.s].name)} → ${esc(byId[lastEdge.t].name)}</b><span class="hline">${esc(lastEdge.why||lastEdge.type)}</span>`:'<span class="hline">개념 페이지에서 내가 아는 연결을 추가해 보세요</span>'}</button>
    <button class="card hcard hthink" data-thinkopen="${tp.id}"><span class="label">🤔 오늘의 Think</span><b class="mid">"${esc(tp.title)}"</b><span class="hline">어디부터 확인하시겠어요?</span></button>
   </div>
   <section class="hsearch"><span class="label">🔍 IT 지식 검색</span><form class="searchbar" id="homeSearch" role="search">${IC.explore}<input id="homeQ" placeholder="기술, 솔루션, 상황 무엇이든: Kafka, Redis, 서버가 느려요" aria-label="검색" autocomplete="off"><button class="btn primary">탐색</button></form><p class="muted" style="font-size:12.5px">지도에 없는 것은 AI가 개념과 연결 관계를 만들어 추가해요.</p></section>
  </div>`;
}

/* ---------- delegated actions ---------- */
document.addEventListener('click',e=>{
  if(e.target.closest('[data-aicancel]')){AIB&&AIB.ctl&&AIB.ctl.abort();Object.values(GAPAI).forEach(x=>x.ctl&&x.busy&&x.ctl.abort());return}
  const sp=e.target.closest('[data-space]'); if(sp){go('space',{tab:sp.dataset.space});return}
  const to=e.target.closest('[data-thinkopen]'); if(to){go('thinkopen',{id:to.dataset.thinkopen});return}
  const un=e.target.closest('[data-und]'); if(un){const id=un.dataset.und;if(state.view==='detail'&&state.id===id)$('#und')?.scrollIntoView({block:'start',behavior:'smooth'});else go('detail',{id,scrollUnd:true});return}
  const ag=e.target.closest('[data-addgap]'); if(ag){const g=addGap({text:ag.dataset.addgap,node:ag.dataset.gapnode,source:ag.dataset.gapsrc||'fb'});ag.disabled=true;ag.textContent='✓ '+ag.dataset.addgap;if(g)toast('지식 공백에 등록했어요.');return}
  const sa=e.target.closest('[data-sgadd]'); if(sa){const [nid,i]=sa.dataset.sgadd.split('|');const sg=SUGG[nid];const x=sg&&sg.items[+i];if(x&&!EDGES.some(y=>y.s===x.s&&y.t===x.t)){addUserEdge({...x,origin:'ai'});x.state='added';saveDoc(sg);toast('내 지식 그래프에 추가했어요.');rerender()}return}
  const sn=e.target.closest('[data-sgno]'); if(sn){const [nid,i]=sn.dataset.sgno.split('|');const sg=SUGG[nid];if(sg&&sg.items[+i]){sg.items[+i].state='dismissed';saveDoc(sg);rerender()}return}
  const gd=e.target.closest('[data-gapdone2]'); if(gd){const g=GAPS.find(x=>x.docId===gd.dataset.gapdone2);if(g){g.done=true;g.doneAt=nowISO();saveDoc(g);toast('해결한 공백으로 옮겼어요.');rerender()}return}
  const gs=e.target.closest('[data-gapstudy]'); if(gs){const g=GAPS.find(x=>x.docId===gs.dataset.gapstudy);if(g){if(g.node&&has(g.node))go(COURSES[g.node]?'deep':'detail',{id:g.node});else go('explore',{q:g.text})}return}
  const gr=e.target.closest('[data-gaprel]'); if(gr){const g=GAPS.find(x=>x.docId===gr.dataset.gaprel);if(g){if(g.node&&has(g.node))go('map',{focus:g.node});else go('explore',{q:g.text})}return}
  const ga=e.target.closest('[data-gapask]'); if(ga){const g=GAPS.find(x=>x.docId===ga.dataset.gapask);if(g)gapAsk(g);return}
  const gt=e.target.closest('[data-gapthink]'); if(gt){const g=GAPS.find(x=>x.docId===gt.dataset.gapthink);if(g){if(GEN&&GEN.busy){toast('다른 생성이 끝나면 다시 눌러 주세요.');return}toast('이 공백을 다루는 사고 문제를 만들고 있어요. 보통 20~60초 걸려요.');startGen('scenario',`${g.text} (이 개념을 이해해야 원인을 찾을 수 있는 장애 상황)`)}return}
  const gx=e.target.closest('[data-gapdel]'); if(gx){if(gx.dataset.armed){GAPS=GAPS.filter(x=>x.docId!==gx.dataset.gapdel);persist(gx.dataset.gapdel,null);rerender()}else{gx.dataset.armed='1';gx.textContent='한 번 더 누르면 삭제';gx.style.color='var(--err-text)'}return}
  const gsa=e.target.closest('[data-gsadd]'); if(gsa&&GAPSUG){const x=GAPSUG[+gsa.dataset.gsadd];if(x){addGap({text:x.text,node:x.node,source:'ai',why:x.why});GAPSUG.splice(+gsa.dataset.gsadd,1);rerender()}return}
  const gsn=e.target.closest('[data-gsno]'); if(gsn&&GAPSUG){GAPSUG.splice(+gsn.dataset.gsno,1);rerender();return}
  const rs=e.target.closest('[data-rvstart]'); if(rs){go('space',{tab:'review',rv:rs.dataset.rvstart});return}
  const i2u=e.target.closest('[data-ins2und]'); if(i2u){const i=INSIGHTS.find(x=>x.docId===i2u.dataset.ins2und);if(i&&has(i.node))go('detail',{id:i.node,prefill:i.docId,undEdit:true,scrollUnd:true});return}
  const i2g=e.target.closest('[data-ins2gap]'); if(i2g){const i=INSIGHTS.find(x=>x.docId===i2g.dataset.ins2gap);if(i){const g=addGap({text:i.text.slice(0,200),node:i.node,source:'note'});i2g.textContent=g?'공백에 등록됨':'이미 있음';i2g.disabled=true}return}
});
document.addEventListener('change',e=>{
  const gc=e.target.closest('[data-gapdone]'); if(gc){const g=GAPS.find(x=>x.docId===gc.dataset.gapdone);if(g){g.done=gc.checked;g.doneAt=gc.checked?nowISO():null;saveDoc(g);setTimeout(rerender,250)}}
});

/* ---------- Think page & open think wiring ---------- */
after.thinkopen=()=>{
  const t=getThink(state.id); if(!t) return; let tm=null;
  $$('[data-ot]').forEach(x=>x.addEventListener('input',()=>{t.answers[x.dataset.ot]=x.value;ensureThink(t);clearTimeout(tm);tm=setTimeout(()=>saveDoc(t),800)}));
  const filled=()=>Object.values(t.answers).some(v=>String(v).trim());
  $('#otFb')?.addEventListener('click',()=>{if(!filled()){toast('먼저 한 칸 이상 써 주세요.');return}ensureThink(t);saveDoc(t);runAI('otfb:'+t.id,s=>thinkFeedback(t,s))});
  const om=$('#otModel'); if(om) om.addEventListener('click',()=>{
    if(!t.rounds.length&&!om.dataset.armed){om.dataset.armed='1';om.textContent='먼저 스스로 써 보는 걸 권해요. 그래도 볼까요?';return}
    ensureThink(t); runAI('otmodel:'+t.id,s=>thinkModel(t,s));
  });
};

loadCustom(CUSTOM);
go('home');
initCloud();
</script>
